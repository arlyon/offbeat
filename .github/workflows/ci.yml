name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: "flutter java rust android-sdk"

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          mise run sdkmanager
          android_home="$(mise where android-sdk)"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$android_home/ndk/28.2.13676358" \
            >> "$GITHUB_ENV"

      - name: Verify offline wiki corpus
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run tool/build_wiki.dart --platform android --check

      - name: Run Flutter tests and analysis
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter test
          flutter analyze lib test tool


  ios:
    name: iOS mobile checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: "flutter rust"

      - name: Install iOS build tools
        run: brew install protobuf

      - name: Verify iOS wiki corpus
        working-directory: apps/mobile
        run: dart run tool/verify_ios_wiki.dart

      - name: Build iOS release without signing
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign --config-only

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: "rust"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler
          rustup component add clippy

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

  server:
    name: Server checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check server and protocol packages
        run: pnpm check
