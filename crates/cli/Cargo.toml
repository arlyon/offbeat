[package]
name = "offbeat-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
offbeat-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
tempfile = "3"
hex = "0.4"
