[package]
name = "offbeat-core"
version = "0.1.0"
edition = "2024"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.102"
base64 = "0.22.1"
blake3 = "1.8.5"
bytes = "1"
chacha20poly1305 = "0.10"
dashmap = "6"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3"
getrandom = "0.2"
hkdf = "0.12"
iroh = { version = "1.0.0-rc.0", default-features = false, features = ["unstable-custom-transports", "tls-aws-lc-rs", "portmapper"] }
iroh-base = "1.0.0-rc.0"
iroh-ble-transport = { path = "../../vendor/iroh-ble-transport/crates/iroh-ble-transport" }
iroh-gossip = "0.99.0"
parking_lot = "0.12"
prost = "0.13"
rand = "0.10.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.1", features = ["v4"] }
yrs = "0.26.0"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
ed25519-dalek = "2.2.0"
getrandom = "0.2"
libc = "0.2"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3.27.0"
