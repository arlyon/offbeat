name = "offbeat-server"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

[[durable_objects.bindings]]
name = "MAIN_DO"
class_name = "MainDO"

[[durable_objects.bindings]]
name = "FESTIVAL_DO"
class_name = "FestivalDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MainDO", "FestivalDO"]

# Set RP_ID when using a tunnel or custom domain for passkey verification:
#   wrangler dev --var RP_ID:manufacturers-decor-decided-reviewer.trycloudflare.com
# Or uncomment below:
# [vars]
# RP_ID = "manufacturers-decor-decided-reviewer.trycloudflare.com"

# Clashfinder API credentials - set these with:
#   wrangler secret put CLASHFINDER_USERNAME
#   wrangler secret put CLASHFINDER_PRIVATE_KEY
