name = "offbeat-server"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"
workers_dev = true
routes = [{ pattern = "offbeat.arlyon.dev", custom_domain = true }]

[[durable_objects.bindings]]
name = "MAIN_DO"
class_name = "MainDO"

[[durable_objects.bindings]]
name = "FESTIVAL_DO"
class_name = "FestivalDO"

[[durable_objects.bindings]]
name = "ARTIST_ENRICHMENT_LIMITER"
class_name = "ArtistEnrichmentLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MainDO", "FestivalDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ArtistEnrichmentLimiterDO"]

[[queues.producers]]
binding = "ARTIST_ENRICHMENT_QUEUE"
queue = "offbeat-artist-enrichment"

[[queues.consumers]]
queue = "offbeat-artist-enrichment"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "offbeat-artist-enrichment-dlq"
max_concurrency = 2
retry_delay = 15

[vars]
RP_ID = "offbeat-server.arlyon.workers.dev"
ANDROID_APK_KEY_HASH = "B0ZyPfRyVmPV3EHDNvzLp1Tu7-VIsVIC-EATRsX7v6Y"
ANDROID_CERT_SHA256 = "07:46:72:3D:F4:72:56:63:D5:DC:41:C3:36:FC:CB:A7:54:EE:EF:E5:48:B1:52:02:F8:40:13:46:C5:FB:BF:A6"
APPLE_TEAM_ID = "KB9978A3CW"
MUSICBRAINZ_USER_AGENT = "Offbeat/1.0 (https://github.com/arlyon/offbeat)"
ARTIST_RESOLUTION_MODEL = "deepseek-v4-flash"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/050f47a87be246734396e92a3579604d/offbeat/deepseek"

# Artist resolution is enabled only when AI_GATEWAY_BASE_URL is configured and
# AI_GATEWAY_TOKEN, BRAVE_SEARCH_API_KEY, DEEPSEEK_API_KEY, and TAVILY_API_KEY are installed as secrets.
# Clashfinder API credentials - set these with:
#   wrangler secret put CLASHFINDER_USERNAME
#   wrangler secret put CLASHFINDER_PRIVATE_KEY
