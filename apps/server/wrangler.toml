name = "offbeat-server"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

[[durable_objects.bindings]]
name = "MAIN_DO"
class_name = "MainDO"

[[durable_objects.bindings]]
name = "FESTIVAL_DO"
class_name = "FestivalDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MainDO", "FestivalDO"]

[[migrations]]
tag = "v2-delete"
deleted_classes = ["MainDO", "FestivalDO"]

[[migrations]]
tag = "v3-recreate"
new_sqlite_classes = ["MainDO", "FestivalDO"]

[[migrations]]
tag = "v4-delete"
deleted_classes = ["MainDO", "FestivalDO"]

[[migrations]]
tag = "v5-recreate"
new_sqlite_classes = ["MainDO", "FestivalDO"]

[vars]
RP_ID = "offbeat-server.arlyon.workers.dev"

# Clashfinder API credentials - set these with:
#   wrangler secret put CLASHFINDER_USERNAME
#   wrangler secret put CLASHFINDER_PRIVATE_KEY
