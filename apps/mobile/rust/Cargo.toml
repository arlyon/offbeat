[package]
name = "offbeat_bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
offbeat-core = { path = "../../../crates/core" }
iroh-ble-transport = { path = "../../../vendor/iroh-ble-transport/crates/iroh-ble-transport" }
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
iroh = "1.0.0-rc.0"
iroh-base = "1.0.0-rc.0"
once_cell = "1"
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
blew = "0.3"
jni = "0.22"
ndk-context = "0.1"
ndk-sys = "0.6"
android_logger = "0.14"
log = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
